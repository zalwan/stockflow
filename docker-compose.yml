name: stockflow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U stockflow -d stockflow]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: ./backend
      target: migrator
    environment:
      DATABASE_URL: postgres://stockflow:stockflow@db:5432/stockflow?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  backend:
    build:
      context: ./backend
      target: api
    environment:
      DATABASE_URL: postgres://stockflow:stockflow@db:5432/stockflow?sslmode=disable
      PORT: "8080"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy
  test-db:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: stockflow_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test -d stockflow_test]
      interval: 1s
      timeout: 3s
      retries: 30
  backend-test:
    image: golang:1.25-bookworm
    profiles: [test]
    working_dir: /app
    volumes:
      - ./backend:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://test:test@test-db:5432/stockflow_test?sslmode=disable
    command: go test -race ./...
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  db-data:
  go-mod:
  go-build:
